[tool.pyrefly]
# Project source roots
project_includes = [".", "tests", "services"]
project_excludes = [".venv", "venv", "__pycache__", ".pytest_cache", ".git"]

# Use the local virtual environment for type stubs
python_interpreter = ".venv/Scripts/python.exe"

# Suppress errors from pyrefly's own in-memory virtual analysis fragments
# These appear as __pyrefly_virtual__/inmemory/*.py and are false positives
# when pyrefly analyses partial code snippets from the IDE

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
